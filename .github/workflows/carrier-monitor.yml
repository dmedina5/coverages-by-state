name: Carrier Eligibility Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      approved:
        description: 'Set to true to send approved message to general channel'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: carrier-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install mysql2

      - name: Check for carrier eligibility changes
        id: check
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_APPROVAL_WEBHOOK_URL: ${{ secrets.SLACK_APPROVAL_WEBHOOK_URL }}
          APPROVED: ${{ github.event.inputs.approved || 'false' }}
        run: node .github/scripts/check-eligibility.js

      - name: Commit and push changes
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html monitor_state.json
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Auto-sync: Carrier eligibility changes detected"
            git push
          } else {
            Write-Host "No changes to commit"
          }
