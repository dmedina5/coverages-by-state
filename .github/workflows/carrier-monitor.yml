name: Carrier Eligibility Monitor

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install mysql2

      - name: Check for carrier eligibility changes
        id: check
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: node .github/scripts/check-eligibility.js

      - name: Commit and push changes
        if: success()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html monitor_state.json
          $changes = git diff --staged --quiet; if ($LASTEXITCODE -ne 0) {
            git commit -m "Auto-sync: Carrier eligibility changes detected`n`nTriggered by GitHub Actions scheduled monitor.`n`nCo-Authored-By: Claude Opus 4.5 <noreply@anthropic.com>"
            git push
          }
