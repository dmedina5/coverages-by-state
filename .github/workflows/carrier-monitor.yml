name: Carrier Eligibility Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      approved:
        description: 'Set to true to send approved message to general channel'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      preview:
        description: 'Set to true to re-send the pending message to the approval DM (nothing is cleared)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: carrier-monitor
  cancel-in-progress: true

jobs:
  monitor:
    # Where this runs is a repository VARIABLE, not a code change:
    #   (unset)         -> self-hosted: the Windows service on Daniel's laptop. Dies
    #                      with the laptop (27 days dark, 2026-08-18 -> 2026-09-14).
    #   ubuntu-latest   -> GitHub-hosted. Needs the two Tailscale secrets below so the
    #                      job can reach the prod read replica through the VPN; set the
    #                      variable only once DevOps has issued them.
    runs-on: ${{ vars.MONITOR_RUNS_ON || 'self-hosted' }}
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # ref: main, not the run's pinned sha — a scheduled run queues before it starts,
      # and a hand-pushed commit in that window left the run's sync commit behind
      # main, so its push was rejected (2026-09-15, run 34918130704).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # Hosted runners have no route to the replica's private VPC address. Join the
      # company VPN as a throwaway node tagged tag:ci; the existing subnet router
      # (ts-relay-management-prod-vpc, 10.101.0.0/16) carries it to the database.
      # Needs: a Tailscale OAuth client with the auth_keys scope restricted to tag:ci,
      # and an ACL grant from tag:ci to the replica on port 3306. Self-hosted runners
      # skip this — the laptop's own Tailscale already routes there.
      - name: Join the VPN (hosted runners only)
        if: runner.environment == 'github-hosted'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes
          use-cache: 'true'

      # On the Windows service, a bare `bash` resolves to C:\windows\system32\bash.exe —
      # the WSL launcher, which has no distribution under the service account and
      # exits 1 ("Windows Subsystem for Linux has no installed distributions",
      # run 34922183981). Put Git for Windows' bash ahead of it for the rest of the job.
      - name: Prefer Git bash over the WSL launcher (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitBash = Join-Path (Split-Path (Split-Path (Get-Command git.exe).Source)) 'bin'
          if (-not (Test-Path (Join-Path $gitBash 'bash.exe'))) { throw "Git bash not found under $gitBash" }
          Add-Content -Path $env:GITHUB_PATH -Value $gitBash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install mysql2

      # Guards the pure sync logic (registry derivation, hash, lottery, change
      # detection, Slack content) before it is allowed to rewrite index.html. No DB or
      # secrets needed.
      - name: Run sync logic self-tests
        run: node .github/scripts/test-eligibility.js

      - name: Check for carrier eligibility changes
        id: check
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_APPROVAL_WEBHOOK_URL: ${{ secrets.SLACK_APPROVAL_WEBHOOK_URL }}
          APPROVED: ${{ github.event.inputs.approved || 'false' }}
          PREVIEW: ${{ github.event.inputs.preview || 'false' }}
        run: node .github/scripts/check-eligibility.js

      # always() so a stale-data failure in the step above still publishes whatever it
      # did manage to sync. A push failure is reported, not swallowed: silently losing
      # the push means the live tool keeps serving old data behind a green run.
      # bash on every runner (Git for Windows supplies it on the self-hosted one — see
      # the PATH step above), so the same step works wherever MONITOR_RUNS_ON points.
      - name: Commit and push changes
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html monitor_state.json pending_notification.json monitor_heartbeat.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-sync: Carrier eligibility changes detected"
          # main may have moved while this job ran. Replay the sync commit on top of
          # it; on a conflict the synced files win (-X theirs = the commit being
          # replayed), since they were just derived from prod and a hand edit to a
          # synced block is stale by definition.
          if ! git pull --rebase -X theirs origin main; then
            echo "::error::Rebase onto main failed - the live tool is now behind this runner's state"
            exit 1
          fi
          if ! git push; then
            echo "::error::Push failed - the live tool is now behind this runner's state"
            exit 1
          fi
